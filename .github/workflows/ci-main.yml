name: Main Branch Validation (main)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  verify_main:
    name: Production Branch Integrity Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Toolchain via Mise
        uses: jdx/mise-action@v4

      - name: Run Spotless Linter
        id: spotless
        run: mise run lint

      - name: Run SEO Validation
        id: seo
        run: mise run seo:validate

      - name: Run Full Test Suite
        id: test
        run: mise run test

      - name: Run Full Project Build
        id: build
        run: mise run build

      - name: Publish Test Report & Annotations
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: '**/build/test-results/**/*.xml'
          detailed_summary: true
          include_passed: true

      - name: Generate Validation Summary
        if: always()
        run: |
          echo "### 📊 Main Branch Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status | Outcome |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| Spotless Linter | ${{ steps.spotless.outcome == 'success' && '✅ Passed' || '❌ Failed' }} | ${{ steps.spotless.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SEO Metadata Validator | ${{ steps.seo.outcome == 'success' && '✅ Passed' || '❌ Failed' }} | ${{ steps.seo.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suites | ${{ steps.test.outcome == 'success' && '✅ Passed' || '❌ Failed' }} | ${{ steps.test.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Full Build Compilation | ${{ steps.build.outcome == 'success' && '✅ Passed' || '❌ Failed' }} | ${{ steps.build.outcome }} |" >> $GITHUB_STEP_SUMMARY
